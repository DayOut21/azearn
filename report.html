<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report a Scam | AzEarn</title>

<style>
body{
font-family:Arial,sans-serif;
background:#0b1220;
margin:0;
color:white;
}
header{
background:#111827;
padding:20px;
text-align:center;
}
.container{
max-width:700px;
margin:40px auto;
background:#182235;
padding:25px;
border-radius:12px;
}
input,select,textarea{
width:100%;
padding:12px;
margin-top:10px;
margin-bottom:20px;
border:none;
border-radius:8px;
font-size:16px;
}
button{
width:100%;
padding:15px;
background:#00c8ff;
border:none;
border-radius:8px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}
a{
color:#00c8ff;
text-decoration:none;
}
</style>

</head>

<body>

<header>
<h1>Report a Scam</h1>
</header>

<div class="container">

<label>Scam Title</label>
<input type="text" placeholder="Example: Fake Investment Website">

<label>Scam Type</label>
<select>
<option>Investment Scam</option>
<option>Phishing</option>
<option>Fake Job</option>
<option>Online Shopping</option>
<option>Other</option>
</select>

<label>Website / App</label>
<input type="text" placeholder="https://example.com">

<label>Amount Lost (Optional)</label>
<input type="number" placeholder="$100">

<label>Description</label>
<textarea rows="6" placeholder="Describe what happened..."></textarea>

<button>Submit Report</button>

<br><br>

<a href="index.html">← Back to Home</a>

</div>

</body>
</html>
